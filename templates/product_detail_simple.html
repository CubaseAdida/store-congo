<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ product.name }} - {{ store.name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="container mt-5">
        <a href="{{ url_for('public_store', store_id=store.id) }}" class="btn btn-secondary mb-4">
            <i class="fas fa-arrow-left"></i> Retour boutique
        </a>
        <div class="row">
            <div class="col-md-6">
                {% if product.image %}
                <img src="{{ url_for('uploaded_file', type='products', filename=product.image) }}" class="img-fluid rounded" alt="{{ product.name }}">
                {% else %}
                <img src="https://via.placeholder.com/400x400?text={{ product.name }}" class="img-fluid rounded" alt="{{ product.name }}">
                {% endif %}
            </div>
            <div class="col-md-6">
                <h1>{{ product.name }}</h1>
                <h2 class="text-danger">{{ product.price }} FCFA</h2>
                <p><strong>Stock:</strong> {{ product.stock }}</p>
                <p><strong>Boutique:</strong> <a href="{{ url_for('public_store', store_id=store.id) }}">{{ store.name }}</a></p>
                <a href="{{ url_for('add_to_cart', product_id=product.id) }}" class="btn btn-warning btn-lg">
                    <i class="fas fa-shopping-cart"></i> Ajouter au panier
                </a>
            </div>
        </div>
    </div>
</body>
</html>
